# Sentinel on a host where another reverse proxy already owns ports 80/443.
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose -f docker-compose.behind-proxy.yml up -d --build
#
# Both ports are published on 127.0.0.1 only:
#   - 127.0.0.1:4318  OTLP/HTTP, for a collector on this host
#   - 127.0.0.1:18080 the dashboard, e.g. through `ssh -L 18080:localhost:18080 host`
#
# To serve it publicly through the existing proxy, also add
# docker-compose.proxy-network.yml (joins the proxy's Docker network) and route
# your domain to sentinel:4318 (/v1/*) and sentinel:8080 (everything else).
name: sentinel

services:
  sentinel:
    build:
      context: ..
    image: sentinel:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_DB: /data/sentinel.db
      PUBLIC_URL: https://${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in .env}
      GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
      # Sentinel writes the fixer's token here (or FIXER_TOKEN from .env).
      FIXER_TOKEN_FILE: /fixer-auth/token
    volumes:
      - sentinel-data:/data
      - ./secrets:/secrets:ro
      - fixer-auth:/fixer-auth
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:18080:8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  fixer:
    build:
      context: ..
      dockerfile: Dockerfile.fixer
    image: sentinel-fixer:latest
    restart: unless-stopped
    depends_on: [sentinel]
    environment:
      SENTINEL_URL: http://sentinel:8080
      FIXER_TOKEN_FILE: /fixer-auth/token
      # Optional defaults: a sign-in or model set in the dashboard wins.
      FIXER_TOKEN: ${FIXER_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${FIXER_ANTHROPIC_API_KEY:-}
      FIXER_EXTRA_TOOLS: ${FIXER_EXTRA_TOOLS:-}
      FIXER_MODEL: ${FIXER_MODEL:-}
    volumes:
      - fixer-work:/work
      - fixer-auth:/fixer-auth:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  sentinel-data:
  fixer-auth:
  fixer-work:
