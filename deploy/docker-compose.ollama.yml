# Optional: a local model for AI analysis, next to Sentinel.
#
# Enable it by adding this file to COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ollama.yml
# then `docker compose up -d`, open AI in the dashboard, pick
# "Local / OpenAI-compatible" with base URL http://ollama:11434/v1 and
# download a model (qwen2.5:1.5b suits a 2-CPU, 4 GB server).
#
# The limits keep a model from starving Sentinel: Ollama gets at most 1.5
# CPUs and OLLAMA_MEMORY of RAM, loads one model and answers one request at
# a time (Sentinel's analysis queue sends one at a time anyway).
services:
  ollama:
    image: ollama/ollama:0.40.12
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Unload the model after 30 idle minutes to give the RAM back.
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama-data:/root/.ollama
    # Not published: Sentinel reaches it as http://ollama:11434.
    expose:
      - "11434"
    mem_limit: ${OLLAMA_MEMORY:-2800m}
    cpus: ${OLLAMA_CPUS:-1.5}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  sentinel:
    environment:
      # Default for the dashboard's base URL field.
      OPENAI_BASE_URL: http://ollama:11434/v1

volumes:
  ollama-data:
