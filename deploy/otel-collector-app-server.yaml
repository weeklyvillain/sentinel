# OpenTelemetry Collector (contrib distribution) for each APP server.
# It receives telemetry from the apps on this machine and forwards it to the
# Sentinel server over HTTPS. If Sentinel or the network is unavailable, data
# is buffered on disk and sent when the connection comes back.
#
# Environment:
#   SENTINEL_ENDPOINT      https://sentinel.example.com
#   SENTINEL_INGEST_TOKEN  same value as INGEST_TOKEN on the Sentinel server
#   HOST_SERVICE_NAME      e.g. host-app-1 (this machine shows up as a service,
#                          so Sentinel flags the whole server as down when it goes quiet)
#
# Requires otelcol-contrib (for file_storage, hostmetrics, resourcedetection).

extensions:
  file_storage/sentinel:
    directory: /var/lib/otelcol/sentinel-queue
    create_directory: true

receivers:
  # Apps on this host send here (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318).
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  # CPU, memory, disk and network of the server itself.
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      load:
      disk:
      filesystem:
      network:

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [env, system]
    override: false
  resource/host:
    attributes:
      - key: service.name
        value: ${env:HOST_SERVICE_NAME}
        action: upsert
  batch:
    send_batch_size: 2048
    timeout: 5s

exporters:
  otlphttp/sentinel:
    endpoint: ${env:SENTINEL_ENDPOINT}
    compression: gzip
    timeout: 15s
    headers:
      Authorization: "Bearer ${env:SENTINEL_INGEST_TOKEN}"
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 0 # keep retrying while the queue has room
    sending_queue:
      enabled: true
      storage: file_storage/sentinel # survives collector restarts
      queue_size: 10000

service:
  extensions: [file_storage/sentinel]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/sentinel]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/sentinel]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/sentinel]
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, resource/host, batch]
      exporters: [otlphttp/sentinel]
