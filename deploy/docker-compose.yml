# Sentinel on its own server, behind Caddy (HTTPS).
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build
#
# Point DNS for SENTINEL_DOMAIN at this server and open ports 80 and 443.
name: sentinel

services:
  sentinel:
    build:
      context: ..
    image: sentinel:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINEL_DB: /data/sentinel.db
      PUBLIC_URL: https://${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in .env}
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
    volumes:
      - sentinel-data:/data
      - ./secrets:/secrets:ro
    # Not published: only reachable through Caddy.
    expose:
      - "4318"
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Automated fixes with Claude Code (opt-in):
  #   docker compose --profile fixer up -d --build
  # with AUTOFIX_MODE=fixer, FIXER_TOKEN and CLAUDE_CODE_OAUTH_TOKEN in .env.
  fixer:
    profiles: [fixer]
    build:
      context: ..
      dockerfile: Dockerfile.fixer
    image: sentinel-fixer:latest
    restart: unless-stopped
    depends_on: [sentinel]
    environment:
      SENTINEL_URL: http://sentinel:8080
      FIXER_TOKEN: ${FIXER_TOKEN:?set FIXER_TOKEN in .env}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${FIXER_ANTHROPIC_API_KEY:-}
      FIXER_EXTRA_TOOLS: ${FIXER_EXTRA_TOOLS:-}
      FIXER_MODEL: ${FIXER_MODEL:-}
    volumes:
      - fixer-work:/work
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [sentinel]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sentinel-data:
  fixer-work:
  caddy-data:
  caddy-config:
